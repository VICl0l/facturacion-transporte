apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: facturacion
spec:
  selector:
    app: schema-registry
  ports:
    - name: http
      port: 8081
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: facturacion
spec:
  replicas: 1

  selector:
    matchLabels:
      app: schema-registry

  template:
    metadata:
      labels:
        app: schema-registry
    spec:
      enableServiceLinks: false

      containers:
        - name: schema-registry
          image: docker.io/confluentinc/cp-schema-registry:7.7.1

          ports:
            - name: http
              containerPort: 8081

          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: schema-registry

            - name: SCHEMA_REGISTRY_LISTENERS
              value: http://0.0.0.0:8081

            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: PLAINTEXT://kafka:9092

            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
              value: "1"

          readinessProbe:
            httpGet:
              path: /subjects
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5