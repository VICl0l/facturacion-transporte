apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: facturacion
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: internal
      port: 9092
      targetPort: internal
    - name: external
      port: 19092
      targetPort: external

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: facturacion
spec:
  serviceName: kafka
  replicas: 1

  selector:
    matchLabels:
      app: kafka

  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false

      securityContext:
        fsGroup: 1000

      containers:
        - name: kafka
          image: docker.io/confluentinc/cp-kafka:7.7.1

          ports:
            - name: internal
              containerPort: 9092
            - name: external
              containerPort: 19092

          env:
            - name: KAFKA_BROKER_ID
              value: "1"

            - name: KAFKA_ZOOKEEPER_CONNECT
              value: zookeeper:2181

            - name: KAFKA_LISTENERS
              value: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092

            - name: KAFKA_ADVERTISED_LISTENERS
              value: INTERNAL://kafka:9092,EXTERNAL://localhost:19092

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"

            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"

            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/logs

            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx512m"

          readinessProbe:
            tcpSocket:
              port: internal
            initialDelaySeconds: 15
            periodSeconds: 5

          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi