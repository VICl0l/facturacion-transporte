quarkus:
  application:
    name: factura-producer

  http:
    host: 0.0.0.0
    port: 8182

  devservices:
    enabled: false

avro:
  codegen:
    enableDecimalLogicalType: true

application:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    topic: ${KAFKA_FACTURAS_TOPIC:facturas-creadas}
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}

mp:
  jwt:
    verify:
      publickey:
        location: publicKey.pem
      issuer: transporte-facturacion