quarkus:
  application:
    name: factura-consumer

  http:
    host: 0.0.0.0
    port: 8183

  devservices:
    enabled: false

  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME:facturas_app}
    password: ${DB_PASSWORD}
    jdbc:
      url: ${DB_JDBC_URL:jdbc:postgresql://localhost:15432/facturacion}

  flyway:
    migrate-at-start: true

  hibernate-orm:
    schema-management:
      strategy: validate

avro:
  codegen:
    enableDecimalLogicalType: true

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

mp:
  jwt:
    verify:
      publickey:
        location: publicKey.pem
      issuer: transporte-facturacion

  messaging:
    incoming:
      facturas:
        connector: smallrye-kafka
        topic: facturas-creadas
        group:
          id: factura-consumer
        auto:
          offset:
            reset: earliest
        enable:
          auto:
            commit: false
        commit-strategy: throttled
        failure-strategy: fail
        key:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value:
          deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
        schema:
          registry:
            url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
        specific:
          avro:
            reader: true